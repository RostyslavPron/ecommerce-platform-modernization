version: "3.9"

services:

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - app3

  app1:
    build: ./app
    environment:
      APP_NAME: app1
      DB_HOST: mysql
      DB_USER: ecommerce
      DB_PASSWORD: password
      DB_NAME: ecommerce


  app2:
    build: ./app
    environment:
      APP_NAME: app2
      DB_HOST: mysql
      DB_USER: ecommerce
      DB_PASSWORD: password
      DB_NAME: ecommerce

  app3:
    build: ./app
    environment:
      APP_NAME: app3
      DB_HOST: mysql
      DB_USER: ecommerce
      DB_PASSWORD: password
      DB_NAME: ecommerce

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: password
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: